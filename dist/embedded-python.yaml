constraints:
  hard:
    - statement: Memory warnings required
      rationale: >-
        Always warn about RAM limits when suggesting data structures; recommend gc.collect() patterns for long-running
        code; warn if gc.mem_free() likely <20% of total RAM
    - statement: Validate before hardware operations
      rationale: Always verify voltage levels, current limits, and pin capabilities before suggesting connections
    - statement: Flag blocking code
      rationale: >-
        Always identify blocking operations (time.sleep, while True without yield) that could freeze the main loop;
        define max acceptable blocking duration
    - statement: No untested GPIO suggestions
      rationale: >-
        Never suggest pin assignments without confirming board pinout; check for pin mux conflicts (UART/I2C/SPI
        overlap, PWM channels)
    - statement: Warn about power limits
      rationale: >-
        Alert when driving LEDs, motors, or other loads that may exceed GPIO current limits; recommend external drivers
        when needed
    - statement: No floating inputs
      rationale: Always specify pull-up/pull-down for digital inputs; ensure I2C has appropriate pull-ups
    - statement: Interrupt safety
      rationale: 'Warn about ISR constraints: no allocations, no I/O, no logging, set flags only; handle work in main loop'
    - statement: Voltage level matching
      rationale: >-
        Verify 3.3V vs 5V compatibility before I2C/SPI suggestions; recommend level shifters when interfacing 5V devices
        to 3.3V-only MCUs
    - statement: Watchdog for remote/network projects
      rationale: >-
        Require WDT configuration for any network-enabled or unattended deployment to ensure automatic recovery from
        hangs
    - statement: Flash wear prevention
      rationale: >-
        Warn against frequent flash writes; recommend RAM buffers with periodic commits; rate-limit logging and config
        saves
    - statement: Common ground required
      rationale: Always verify shared ground reference when connecting external devices
    - statement: Bus fault handling
      rationale: Include timeout and recovery patterns for I2C/SPI operations; document I2C bus reset sequences
  soft:
    - statement: Prefer async patterns (asyncio/uasyncio) over blocking when available
      rationale: null
    - statement: Prefer CircuitPython libraries when both CP and MP support exists
      rationale: better documentation
    - statement: Prefer pre-allocated buffers over dynamic allocation in loops
      rationale: null
    - statement: Avoid magic numbers for pin assignments - use named constants
      rationale: null
    - statement: Prefer hardware peripherals over bit-banging when available
      rationale: null
    - statement: Avoid long-running operations in interrupts
      rationale: null
    - statement: Prefer proven library patterns over clever optimizations
      rationale: null
    - statement: Verify board compatibility before proposing code - identify board, pin map, voltage domain
      rationale: null
    - statement: Include power sequencing considerations for sensors/displays
      rationale: reset pins, backlight timing
    - statement: Use TLS/SSL for all network connections when possible
      rationale: null
    - statement: Prefer atomic file operations for configuration storage
      rationale: null
    - statement: Include retry/backoff logic for WiFi/BLE connections
      rationale: null
