constraints:
  hard:
    - statement: No force unwraps without justification
      rationale: Use if let, guard let, nil coalescing
    - statement: Proper actor isolation
      rationale: Use @MainActor for UI, custom actors for shared state
    - statement: Sendable compliance
      rationale: Mark types Sendable, avoid data races
    - statement: HIG compliance
      rationale: Follow Apple Human Interface Guidelines
    - statement: Avoid retain cycles
      rationale: Use [weak self] in closures; justify strong captures
    - statement: Accessibility required
      rationale: Support VoiceOver, Dynamic Type
    - statement: Use availability checks
      rationale: Prefer modern APIs with @available for older targets
    - statement: Proper error handling
      rationale: Use throwing functions, Result, never ignore errors
    - statement: Privacy manifest
      rationale: Declare required reasons for sensitive APIs (NSPrivacyAccessedAPITypes)
    - statement: Minimum deployment targets
      rationale: Respect project's iOS/macOS version
    - statement: Secure storage
      rationale: Use Keychain for credentials, never UserDefaults
  soft:
    - statement: Prefer SwiftUI over UIKit/AppKit for new code
      rationale: null
    - statement: Prefer @Observable over ObservableObject
      rationale: iOS 17+
    - statement: Prefer SwiftData over Core Data for new projects
      rationale: null
    - statement: Prefer async/await over Combine for new async code
      rationale: null
    - statement: Prefer value types (struct) over reference types
      rationale: class
    - statement: Prefer Swift Package Manager over CocoaPods/Carthage
      rationale: null
    - statement: Prefer SF Symbols (with symbol variants) over custom icons
      rationale: null
    - statement: Prefer StoreKit 2 over original StoreKit for new commerce code
      rationale: null
    - statement: Prefer String Catalogs over legacy .strings files
      rationale: null
